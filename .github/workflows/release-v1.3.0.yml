name: Publish JUSTECH Downloader v1.3.0
on:
  push:
    branches: [release/v1.3.0]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies and Chromium
        shell: pwsh
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r requirements.txt
          python -m playwright install chromium
      - name: Build EXE
        shell: pwsh
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name JUSTECH-Downloader-v1.3.0 --collect-all playwright --collect-all openpyxl --collect-all tzdata desktop_entry_v130.py
          $folder = "dist/JUSTECH-Downloader-v1.3.0"
          if (!(Test-Path "$folder/JUSTECH-Downloader-v1.3.0.exe")) { throw "EXE missing" }
          $chrome = Get-ChildItem "$folder/_internal/playwright/driver/package/.local-browsers" -Filter chrome.exe -Recurse -File | Select-Object -First 1
          if (!$chrome) { throw "Chromium missing" }
      - name: Create clean ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/JUSTECH-Downloader-v1.3.0" -DestinationPath "JUSTECH-Downloader-v1.3.0-Windows.zip" -CompressionLevel Optimal
      - name: Publish release and asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.3.0"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "JUSTECH-Downloader-v1.3.0-Windows.zip" --clobber
            gh release edit $tag --title "JUSTECH 銷售報表下載器 v1.3.0" --notes-file "RELEASE_NOTES_v1.3.0.md"
          } else {
            gh release create $tag "JUSTECH-Downloader-v1.3.0-Windows.zip" --target "${{ github.sha }}" --title "JUSTECH 銷售報表下載器 v1.3.0" --notes-file "RELEASE_NOTES_v1.3.0.md"
          }
